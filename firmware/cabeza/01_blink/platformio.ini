; KISUBOT - Cabeza - Paso 1: blink
; Placa: ESP32-S3 N16R8 (16MB flash QIO, 8MB PSRAM OPI), USB nativo.

[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Serial por el USB nativo (USB-Serial/JTAG), sin chip puente
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
