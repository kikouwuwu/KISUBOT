; KISUBOT - firmware de la cabeza (ESP32-S3) y del cuerpo (ESP32 NodeMCU)
;
; Cada programa es un entorno (env). En VS Code, elige el entorno en la barra
; inferior de PlatformIO ("Switch PlatformIO Project Environment") y usa
; Build, Upload y Monitor.
;
; Desde la terminal:
;   pio run -e cabeza-01-blink -t upload
;   pio device monitor -e cabeza-01-blink
;
; Puertos u otros ajustes de tu computador: ponlos en platformio_local.ini
; (no se sube al repo). Ejemplo en platformio_local.ini.example.

[platformio]
default_envs = cabeza-04-uart
extra_configs = platformio_local.ini

; ---------- Común a todos los programas ----------
[env]
platform = espressif32 @ ^8.0.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------- Cabeza: ESP32-S3 N16R8 con cámara ----------
; 16 MB de flash (QIO) y 8 MB de PSRAM (OPI).
[cabeza]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
; Serial por el USB nativo (USB-Serial/JTAG), sin chip puente
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- Cuerpo: ESP32 NodeMCU (ESP-32S) ----------
[cuerpo]
board = nodemcu-32s

; ---------- Programas de la cabeza ----------

; Fase 1: hacer parpadear el LED IO2
[env:cabeza-01-blink]
extends = cabeza
build_src_filter = +<cabeza/01_blink/>

; Fase 2: página web por WiFi para prender y apagar el LED
[env:cabeza-02-wifi-web]
extends = cabeza
build_src_filter = +<cabeza/02_wifi_web/>

; Fase 4: la cabeza le manda órdenes al cuerpo por UART
[env:cabeza-04-uart]
extends = cabeza
build_src_filter = +<cabeza/04_uart/>

; Fase 5: "¿Qué ves?" con la cámara y Gemini
[env:cabeza-05-vision]
extends = cabeza
build_src_filter = +<cabeza/05_vision/>
lib_deps = bblanchon/ArduinoJson @ ^7.2.0

; Fase 5 sin placa: prueba de Gemini pensada para el simulador Wokwi
[env:cabeza-05-prueba-wokwi]
extends = cabeza
build_src_filter = +<cabeza/05_prueba_wokwi/>
lib_deps = bblanchon/ArduinoJson @ ^7.2.0

; Fase 6: nivel de sonido del micrófono INMP441
[env:cabeza-06-microfono]
extends = cabeza
build_src_filter = +<cabeza/06_microfono/>

; ---------- Programas del cuerpo ----------

; Fase 4: el cuerpo recibe órdenes de la cabeza y responde
[env:cuerpo-04-uart]
extends = cuerpo
build_src_filter = +<cuerpo/04_uart/>
